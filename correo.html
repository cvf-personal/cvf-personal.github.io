<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-NF2ARfu49UePDVXEC3e7oVYSa/H4ePMeoJS3b8xeBuM='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Abrir borrador</title>
<style>
  :root { --papel:#EEF3F7; --tinta:#1F2D45; --suave:#5D6982; --linea:#DAE3EE; --anil:#2E4E8C; }
  @media (prefers-color-scheme: dark) {
    :root { --papel:#141B26; --tinta:#E4EAF2; --suave:#97A3B6; --linea:#26324A; --anil:#3A5C9C; }
  }
  body { margin:0; background:var(--papel); color:var(--tinta);
         font:16px/1.6 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  .etiqueta { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--suave); }
  a.boton { display:block; text-align:center; padding:14px; margin:12px 0; border-radius:4px;
            background:var(--anil); color:#fff; text-decoration:none; font-weight:600; }
  a.otro { display:block; text-align:center; padding:10px; color:var(--tinta); }
  pre { white-space:pre-wrap; word-wrap:break-word; border:1px solid var(--linea);
        border-radius:4px; padding:12px; font:inherit; }
</style>
</head>
<body>
<main>
  <p class="etiqueta">Borrador de Hermes</p>
  <a class="boton" id="gmail" href="#">Abrir en la app de Gmail</a>
  <a class="otro" id="web" href="#">Gmail en el navegador</a>
  <a class="otro" id="mail" href="#">Otra app de correo</a>
  <p class="etiqueta">Para</p><pre id="para"></pre>
  <p class="etiqueta">Asunto</p><pre id="asunto"></pre>
  <p class="etiqueta">Texto</p><pre id="texto"></pre>
</main>
<script>
// El borrador viaja después del #: el navegador nunca lo manda a ningún servidor.
// Nada se inserta como HTML; solo como texto.
(function () {
  var h = new URLSearchParams(location.hash.slice(1));
  var para = (h.get("to") || "").slice(0, 500);
  var asunto = (h.get("su") || "").slice(0, 300);
  var texto = (h.get("body") || "").slice(0, 6000);
  // Solo direcciones de correo, separadas por coma.
  if (!/^([^\s@,<>"]+@[^\s@,<>"]+)(,\s*[^\s@,<>"]+@[^\s@,<>"]+)*$/.test(para)) para = "";
  var e = encodeURIComponent;
  document.getElementById("para").textContent = para || "(sin destinatario)";
  document.getElementById("asunto").textContent = asunto;
  document.getElementById("texto").textContent = texto;
  var app = "googlegmail:///co?to=" + e(para) + "&subject=" + e(asunto) + "&body=" + e(texto);
  document.getElementById("gmail").href = app;
  document.getElementById("web").href = "https://mail.google.com/mail/?view=cm&fs=1&to=" + e(para) +
    "&su=" + e(asunto) + "&body=" + e(texto);
  document.getElementById("mail").href = "mailto:" + e(para).replace(/%40/g, "@").replace(/%2C/g, ",") +
    "?subject=" + e(asunto) + "&body=" + e(texto);
  if (/iPhone|iPad/.test(navigator.userAgent)) location.href = app;
})();
</script>
</body>
</html>
